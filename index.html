<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FloppyStation Sticker Creator</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link id="theme-css" rel="stylesheet" href="vendor/98.css-0.1.21/98.css">
  <script>
    // Apply the remembered theme before first paint (js/theme.js owns the key).
    try {
      if (localStorage.getItem('fssc.theme') === 'xp') {
        document.getElementById('theme-css').href = 'vendor/xp.css-0.2.6/XP.css';
        document.documentElement.dataset.theme = 'xp';
      }
    } catch (error) { /* storage blocked: default theme */ }
  </script>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="window app-window">
    <div class="title-bar">
      <div class="title-bar-text app-title"><img class="title-icon" src="icon.svg" alt="" width="16" height="16"><span data-i18n="appTitle"></span></div>
    </div>

    <nav class="menu-bar" role="menubar">
      <div class="menu">
        <button class="menu-title" aria-haspopup="true" aria-expanded="false" data-i18n="menu.file"></button>
        <ul class="menu-popup" role="menu">
          <li role="none"><button role="menuitem" data-action="new" data-i18n="menu.new"></button></li>
          <li role="none"><button role="menuitem" data-action="open" data-shortcut="Ctrl+O" data-i18n="menu.open"></button></li>
          <li role="none"><button role="menuitem" data-action="save" data-shortcut="Ctrl+S" data-i18n="menu.save"></button></li>
          <li role="separator" class="menu-separator"></li>
          <li role="none"><button role="menuitem" data-action="export" data-shortcut="Ctrl+E" data-i18n="menu.export"></button></li>
        </ul>
      </div>
      <div class="menu">
        <button class="menu-title" aria-haspopup="true" aria-expanded="false" data-i18n="menu.edit"></button>
        <ul class="menu-popup" role="menu">
          <li role="none"><button role="menuitem" data-action="undo" data-shortcut="Ctrl+Z" disabled data-i18n="menu.undo"></button></li>
          <li role="none"><button role="menuitem" data-action="redo" data-shortcut="Ctrl+Y" disabled data-i18n="menu.redo"></button></li>
          <li role="separator" class="menu-separator"></li>
          <li role="none"><button role="menuitem" data-action="reset" data-i18n="menu.reset"></button></li>
        </ul>
      </div>
      <div class="menu">
        <button class="menu-title" aria-haspopup="true" aria-expanded="false" data-i18n="menu.view"></button>
        <ul class="menu-popup" role="menu">
          <li role="none"><button role="menuitem" data-action="zoom-in" data-shortcut="Ctrl++" data-i18n="menu.zoomIn"></button></li>
          <li role="none"><button role="menuitem" data-action="zoom-out" data-shortcut="Ctrl+-" data-i18n="menu.zoomOut"></button></li>
          <li role="none"><button role="menuitem" data-action="zoom-100" data-shortcut="Ctrl+1" data-i18n="menu.actualSize"></button></li>
          <li role="none"><button role="menuitem" data-action="zoom-fit" data-shortcut="Ctrl+0" data-i18n="menu.fit"></button></li>
          <li role="separator" class="menu-separator"></li>
          <li role="none"><button role="menuitem" data-action="side-front" data-i18n="menu.sideFront"></button></li>
          <li role="none"><button role="menuitem" data-action="side-back" data-i18n="menu.sideBack"></button></li>
          <li role="separator" class="menu-separator"></li>
          <li role="none" class="has-submenu">
            <button role="menuitem" aria-haspopup="true" data-i18n="menu.theme"></button>
            <ul class="menu-popup submenu" role="menu">
              <li role="none"><button role="menuitemradio" aria-checked="false" data-action="theme-98" data-i18n="menu.theme98"></button></li>
              <li role="none"><button role="menuitemradio" aria-checked="false" data-action="theme-xp" data-i18n="menu.themeXp"></button></li>
            </ul>
          </li>
        </ul>
      </div>
      <div class="menu">
        <button class="menu-title" aria-haspopup="true" aria-expanded="false" data-i18n="menu.help"></button>
        <ul class="menu-popup" role="menu">
          <li role="none"><button role="menuitem" data-action="about" data-i18n="menu.about"></button></li>
        </ul>
      </div>
    </nav>

    <div class="window-body app-body">
      <aside class="sidebar">
        <fieldset id="floppy-panel">
          <legend data-i18n="groups.floppy"></legend>

          <p class="group-caption" data-i18n="floppy.labelType"></p>
          <div class="field-row">
            <input id="mode-front" type="radio" name="label-mode" value="front">
            <label for="mode-front" data-i18n="floppy.modeFront"></label>
          </div>
          <div class="field-row">
            <input id="mode-wrap" type="radio" name="label-mode" value="wrap">
            <label for="mode-wrap" data-i18n="floppy.modeWrap"></label>
          </div>

          <div class="field-row">
            <label for="corner-style" data-i18n="floppy.corners"></label>
            <select id="corner-style">
              <option value="square" data-i18n="floppy.cornersSquare"></option>
              <option value="two" data-i18n="floppy.cornersTwo"></option>
              <option value="four" data-i18n="floppy.cornersFour"></option>
            </select>
          </div>

          <p class="group-caption" data-i18n="floppy.guides"></p>
          <div class="field-row">
            <input id="guide-safety" type="checkbox" data-guide="safety">
            <label for="guide-safety" data-i18n="floppy.guideSafety"></label>
          </div>
          <div class="field-row">
            <input id="guide-bleed" type="checkbox" data-guide="bleed">
            <label for="guide-bleed" data-i18n="floppy.guideBleed"></label>
          </div>
          <div class="field-row">
            <input id="guide-fold" type="checkbox" data-guide="fold">
            <label for="guide-fold" data-i18n="floppy.guideFold"></label>
          </div>

          <div class="field-row advanced-toggle-row">
            <button id="advanced-toggle" aria-expanded="false" aria-controls="advanced-panel"></button>
          </div>

          <fieldset id="advanced-panel" class="advanced-panel" hidden>
            <legend data-i18n="floppy.advanced"></legend>
            <p class="group-caption" data-i18n="floppy.dimsWrap"></p>
            <div class="dim-grid">
              <label for="dim-width" data-i18n="floppy.dimWidth"></label>
              <input id="dim-width" type="text" inputmode="decimal" data-dim="width">
              <span data-i18n="units.mm"></span>
              <label for="dim-front" data-i18n="floppy.dimFront"></label>
              <input id="dim-front" type="text" inputmode="decimal" data-dim="front">
              <span data-i18n="units.mm"></span>
              <label for="dim-spine" data-i18n="floppy.dimSpine"></label>
              <input id="dim-spine" type="text" inputmode="decimal" data-dim="spine">
              <span data-i18n="units.mm"></span>
              <label for="dim-back" data-i18n="floppy.dimBack"></label>
              <input id="dim-back" type="text" inputmode="decimal" data-dim="back">
              <span data-i18n="units.mm"></span>
              <label for="dim-front-only" data-i18n="floppy.dimFrontOnly"></label>
              <input id="dim-front-only" type="text" inputmode="decimal" data-dim="frontOnlyHeight">
              <span data-i18n="units.mm"></span>
              <label for="dim-radius" data-i18n="floppy.dimRadius"></label>
              <input id="dim-radius" type="text" inputmode="decimal" data-dim="cornerRadius">
              <span data-i18n="units.mm"></span>
            </div>
            <div class="field-row reset-row">
              <button id="reset-dimensions" data-i18n="floppy.resetDefaults"></button>
            </div>
          </fieldset>
        </fieldset>
        <fieldset id="images-panel">
          <legend data-i18n="groups.images"></legend>

          <div class="image-slot" id="background-slot">
            <p class="group-caption" data-i18n="images.background"></p>
            <div class="field-row">
              <button data-image-action="add" data-i18n="images.add"></button>
              <button data-image-action="remove" data-i18n="images.remove"></button>
            </div>
            <p class="slot-target"></p>
            <div class="field-row fill-row">
              <span data-i18n="images.fill"></span>
              <button data-fill="label" data-i18n="images.fillLabel" data-i18n-title="images.fillHint"></button>
              <button data-fill="front" data-i18n="images.fillFront" data-i18n-title="images.fillHint"></button>
              <button data-fill="back" data-i18n="images.fillBack" data-i18n-title="images.fillHint"></button>
            </div>
          </div>

          <div class="image-slot" id="logo-slot">
            <p class="group-caption" data-i18n="images.logo"></p>
            <div class="field-row">
              <button data-image-action="add" data-i18n="images.add"></button>
              <button data-image-action="remove" data-i18n="images.remove"></button>
            </div>
            <p class="slot-target"></p>
            <div class="effect-grid">
              <span class="effect-toggle">
                <input id="logo-outline" type="checkbox" data-effect="outline.enabled">
                <label for="logo-outline" data-i18n="images.outline"></label>
              </span>
              <input type="color" data-effect="outline.color" data-i18n-title="images.color">
              <input type="text" inputmode="decimal" data-effect="outline.width" data-i18n-title="images.outlineWidth">
              <span data-i18n="units.mm"></span>

              <span class="effect-toggle">
                <input id="logo-shadow" type="checkbox" data-effect="shadow.enabled">
                <label for="logo-shadow" data-i18n="images.shadow"></label>
              </span>
              <input type="color" data-effect="shadow.color" data-i18n-title="images.color">
              <input type="text" inputmode="decimal" data-effect="shadow.offset" data-i18n-title="images.shadowOffset">
              <span data-i18n="units.mm"></span>

              <label class="effect-sub" data-i18n="images.shadowBlur"></label>
              <input type="text" inputmode="decimal" data-effect="shadow.blur" data-i18n-title="images.shadowBlur">
              <span data-i18n="units.mm"></span>
            </div>
          </div>

          <p class="hint" data-i18n="images.dropHint"></p>
        </fieldset>
        <fieldset id="layers-panel">
          <legend data-i18n="groups.layers"></legend>
          <ul class="layer-list" role="listbox"></ul>
          <div class="field-row layer-buttons">
            <button data-layer-action="up" data-i18n="layerList.up"></button>
            <button data-layer-action="down" data-i18n="layerList.down"></button>
            <button data-layer-action="delete" data-i18n="layerList.delete"></button>
          </div>
        </fieldset>
        <fieldset id="text-panel">
          <legend data-i18n="groups.text"></legend>
          <div class="field-row fill-row">
            <span data-i18n="textPanel.add"></span>
            <button data-add-text="front" data-i18n="textPanel.front"></button>
            <button data-add-text="spine" data-i18n="textPanel.spine"></button>
            <button data-add-text="back" data-i18n="textPanel.back"></button>
          </div>
          <p class="slot-target" id="text-target"></p>
          <textarea id="text-content" rows="2" class="text-content" data-i18n-title="textPanel.contentHint"></textarea>
          <div class="text-grid">
            <label for="text-font" data-i18n="textPanel.font"></label>
            <select id="text-font"></select>
            <label for="text-size" data-i18n="textPanel.size"></label>
            <div class="field-row">
              <input id="text-size" type="text" inputmode="decimal">
              <span data-i18n="textPanel.pt"></span>
            </div>
            <label for="text-color" data-i18n="textPanel.color"></label>
            <div class="field-row">
              <input id="text-color" type="color">
              <span class="align-buttons">
                <button data-align="left" aria-pressed="false" data-i18n="textPanel.left"></button>
                <button data-align="center" aria-pressed="true" data-i18n="textPanel.center"></button>
                <button data-align="right" aria-pressed="false" data-i18n="textPanel.right"></button>
              </span>
            </div>
          </div>
          <div class="effect-grid">
            <span class="effect-toggle">
              <input id="text-outline" type="checkbox" data-text-effect="outline.enabled">
              <label for="text-outline" data-i18n="images.outline"></label>
            </span>
            <input type="color" data-text-effect="outline.color" data-i18n-title="images.color">
            <input type="text" inputmode="decimal" data-text-effect="outline.width" data-i18n-title="images.outlineWidth">
            <span data-i18n="units.mm"></span>

            <span class="effect-toggle">
              <input id="text-shadow" type="checkbox" data-text-effect="shadow.enabled">
              <label for="text-shadow" data-i18n="images.shadow"></label>
            </span>
            <input type="color" data-text-effect="shadow.color" data-i18n-title="images.color">
            <input type="text" inputmode="decimal" data-text-effect="shadow.offset" data-i18n-title="images.shadowOffset">
            <span data-i18n="units.mm"></span>

            <label class="effect-sub" data-i18n="images.shadowBlur"></label>
            <input type="text" inputmode="decimal" data-text-effect="shadow.blur" data-i18n-title="images.shadowBlur">
            <span data-i18n="units.mm"></span>
          </div>
          <div class="field-row text-remove-row">
            <button id="text-remove" data-i18n="images.remove"></button>
          </div>
          <p class="hint" data-i18n="textPanel.hint"></p>
        </fieldset>
        <fieldset id="style-panel">
          <legend data-i18n="groups.style"></legend>
          <div class="field-row">
            <label for="effect-preset" data-i18n="style.preset"></label>
            <select id="effect-preset"></select>
          </div>
          <div class="effect-sliders">
            <label for="effect-border" data-i18n="style.border"></label>
            <input id="effect-border" type="range" data-effect-key="border">
            <span class="slider-value" data-effect-value="border"></span>
            <label for="effect-fade" data-i18n="style.fade"></label>
            <input id="effect-fade" type="range" data-effect-key="fade">
            <span class="slider-value" data-effect-value="fade"></span>
            <label for="effect-darken" data-i18n="style.darken"></label>
            <input id="effect-darken" type="range" data-effect-key="darken">
            <span class="slider-value" data-effect-value="darken"></span>
            <label for="effect-grain" data-i18n="style.grain"></label>
            <input id="effect-grain" type="range" data-effect-key="grain">
            <span class="slider-value" data-effect-value="grain"></span>
          </div>
          <p class="hint" data-i18n="style.hint"></p>
        </fieldset>
        <fieldset>
          <legend data-i18n="groups.export"></legend>
          <div class="field-row">
            <button data-action="export" data-i18n="menu.export"></button>
          </div>
          <p class="hint" data-i18n="exportDialog.groupHint"></p>

          <div id="sheet-panel">
            <p class="group-caption"><span data-i18n="sheet.title"></span> <span class="sheet-count" id="sheet-count"></span></p>
            <ul class="layer-list sheet-list" role="listbox"></ul>
            <div class="field-row layer-buttons">
              <button data-sheet-action="add" data-i18n="sheet.add" data-i18n-title="sheet.addHint"></button>
              <button data-sheet-action="add-project" data-i18n="sheet.addProject"></button>
            </div>
            <div class="field-row layer-buttons">
              <button data-sheet-action="open" data-i18n="sheet.open" data-i18n-title="sheet.openHint"></button>
              <button data-sheet-action="remove" data-i18n="sheet.remove"></button>
            </div>
            <p class="hint" data-i18n="sheet.hint"></p>
          </div>
        </fieldset>
      </aside>

      <main class="workspace">
        <div class="zoom-toolbar">
          <button data-action="zoom-fit" data-i18n="zoom.fit" data-i18n-title="menu.fit"></button>
          <button data-action="zoom-100" data-i18n="zoom.actual" data-i18n-title="menu.actualSize"></button>
          <button data-action="zoom-out" class="zoom-step" data-i18n="zoom.out" data-i18n-title="menu.zoomOut"></button>
          <button data-action="zoom-in" class="zoom-step" data-i18n="zoom.in" data-i18n-title="menu.zoomIn"></button>
          <span class="zoom-readout" id="zoom-readout"></span>
          <span class="toolbar-gap"></span>
          <button data-action="side-front" class="side-button" aria-pressed="true" data-i18n="side.front"></button>
          <button data-action="side-back" class="side-button" aria-pressed="false" data-i18n="side.back" data-i18n-title="side.backHint"></button>
          <span class="side-note" id="side-note" data-i18n="side.readOnly" hidden></span>
        </div>
        <div class="canvas-scroll">
          <canvas id="label-canvas"></canvas>
        </div>
      </main>
    </div>

    <div class="status-bar">
      <p class="status-bar-field" id="status-label"></p>
      <p class="status-bar-field" id="status-zoom"></p>
    </div>
  </div>
  <div class="modal-backdrop" id="export-dialog" hidden>
    <div class="window export-dialog" role="dialog" aria-modal="true" aria-labelledby="export-title">
      <div class="title-bar">
        <div class="title-bar-text" id="export-title" data-i18n="exportDialog.title"></div>
        <div class="title-bar-controls">
          <button aria-label="Close" type="button"></button>
        </div>
      </div>
      <form class="window-body">
        <div class="export-grid">
          <label for="export-filename" data-i18n="exportDialog.filename"></label>
          <input id="export-filename" type="text" value="floppy-label">
          <label for="export-type" data-i18n="exportDialog.type"></label>
          <select id="export-type">
            <option value="pdf" data-i18n="exportDialog.typePdf"></option>
            <option value="png" data-i18n="exportDialog.typePng"></option>
            <option value="sheet" id="export-type-sheet"></option>
            <option value="json" data-i18n="exportDialog.typeProject"></option>
          </select>
          <label for="export-dpi" id="export-dpi-label" data-i18n="exportDialog.resolution"></label>
          <select id="export-dpi">
            <option value="300" data-i18n="exportDialog.dpi300"></option>
            <option value="600" data-i18n="exportDialog.dpi600"></option>
          </select>
          <label for="export-copies" id="export-copies-label" data-i18n="exportDialog.copies"></label>
          <div class="field-row" id="export-copies-row">
            <input id="export-copies" type="text" inputmode="numeric" value="1">
            <span id="export-copies-max"></span>
          </div>
        </div>

        <div class="field-row" id="export-cutline-row">
          <input id="export-cutline" type="checkbox" checked>
          <label for="export-cutline" data-i18n="exportDialog.cutLine"></label>
        </div>
        <div class="field-row" id="export-foldlines-row">
          <input id="export-foldlines" type="checkbox" checked>
          <label for="export-foldlines" data-i18n="exportDialog.foldLines"></label>
        </div>

        <p class="export-note" data-i18n="exportDialog.printNote"></p>

        <div class="progress" hidden><div class="progress-bar"></div></div>
        <p class="export-status" id="export-status" aria-live="polite"></p>

        <div class="field-row dialog-buttons">
          <button id="export-save" type="submit" class="default" data-i18n="exportDialog.save"></button>
          <button id="export-cancel" type="button" data-i18n="exportDialog.cancel"></button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="about-dialog" hidden>
    <div class="window about-dialog" role="dialog" aria-modal="true" aria-labelledby="about-title">
      <div class="title-bar">
        <div class="title-bar-text" id="about-title" data-i18n="about.title"></div>
        <div class="title-bar-controls">
          <button aria-label="Close" type="button"></button>
        </div>
      </div>
      <div class="window-body">
        <p class="about-name"><img src="icon.svg" alt="" width="32" height="32"><span data-i18n="appTitle"></span></p>
        <p data-i18n="about.version"></p>
        <p data-i18n="about.description"></p>
        <p data-i18n="about.privacy"></p>
        <p data-i18n="about.credits"></p>
        <p><a href="https://github.com/markjunior2045/FloppyStationStickerCreator" target="_blank" rel="noopener" data-i18n="about.source"></a></p>
        <div class="field-row dialog-buttons">
          <button type="button" class="default" data-close data-i18n="about.ok"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- jsPDF UMD build (its ES build has bare imports); exposes window.jspdf. -->
  <script src="vendor/jspdf-4.2.1/jspdf.umd.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
