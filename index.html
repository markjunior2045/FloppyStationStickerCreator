<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FloppyStation Sticker Creator</title>
  <link rel="icon" href="data:,">
  <link id="theme-css" rel="stylesheet" href="vendor/98.css-0.1.21/98.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="window app-window">
    <div class="title-bar">
      <div class="title-bar-text" data-i18n="appTitle"></div>
    </div>

    <nav class="menu-bar" role="menubar">
      <div class="menu">
        <button class="menu-title" aria-haspopup="true" aria-expanded="false" data-i18n="menu.file"></button>
        <ul class="menu-popup" role="menu">
          <li role="none"><button role="menuitem" data-action="new" disabled data-i18n="menu.new"></button></li>
          <li role="none"><button role="menuitem" data-action="open" disabled data-i18n="menu.open"></button></li>
          <li role="none"><button role="menuitem" data-action="save" disabled data-i18n="menu.save"></button></li>
          <li role="separator" class="menu-separator"></li>
          <li role="none"><button role="menuitem" data-action="export" disabled data-i18n="menu.export"></button></li>
        </ul>
      </div>
      <div class="menu">
        <button class="menu-title" aria-haspopup="true" aria-expanded="false" data-i18n="menu.edit"></button>
        <ul class="menu-popup" role="menu">
          <li role="none"><button role="menuitem" data-action="undo" disabled data-i18n="menu.undo"></button></li>
          <li role="none"><button role="menuitem" data-action="redo" disabled data-i18n="menu.redo"></button></li>
        </ul>
      </div>
      <div class="menu">
        <button class="menu-title" aria-haspopup="true" aria-expanded="false" data-i18n="menu.view"></button>
        <ul class="menu-popup" role="menu">
          <li role="none"><button role="menuitem" data-action="zoom-in" disabled data-i18n="menu.zoomIn"></button></li>
          <li role="none"><button role="menuitem" data-action="zoom-out" disabled data-i18n="menu.zoomOut"></button></li>
          <li role="none"><button role="menuitem" data-action="zoom-100" disabled data-i18n="menu.actualSize"></button></li>
          <li role="none"><button role="menuitem" data-action="zoom-fit" disabled data-i18n="menu.fit"></button></li>
        </ul>
      </div>
      <div class="menu">
        <button class="menu-title" aria-haspopup="true" aria-expanded="false" data-i18n="menu.help"></button>
        <ul class="menu-popup" role="menu">
          <li role="none"><button role="menuitem" data-action="about" disabled data-i18n="menu.about"></button></li>
        </ul>
      </div>
    </nav>

    <div class="window-body app-body">
      <aside class="sidebar">
        <fieldset>
          <legend data-i18n="groups.floppy"></legend>
          <p class="placeholder" data-i18n="groups.notYet"></p>
        </fieldset>
        <fieldset>
          <legend data-i18n="groups.images"></legend>
          <p class="placeholder" data-i18n="groups.notYet"></p>
        </fieldset>
        <fieldset>
          <legend data-i18n="groups.text"></legend>
          <p class="placeholder" data-i18n="groups.notYet"></p>
        </fieldset>
        <fieldset>
          <legend data-i18n="groups.style"></legend>
          <p class="placeholder" data-i18n="groups.notYet"></p>
        </fieldset>
        <fieldset>
          <legend data-i18n="groups.export"></legend>
          <p class="placeholder" data-i18n="groups.notYet"></p>
        </fieldset>
      </aside>

      <main class="workspace">
        <div class="canvas-scroll">
          <canvas id="label-canvas"></canvas>
        </div>
      </main>
    </div>

    <div class="status-bar">
      <p class="status-bar-field" id="status-label">Label: —</p>
      <p class="status-bar-field" id="status-lib">Fabric.js —</p>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
